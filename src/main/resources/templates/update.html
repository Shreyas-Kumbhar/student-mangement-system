<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <link rel="stylesheet" th:href="@{/css/update.css}">
</head>
<body>
<div class="container">
    <h1>Update Student</h1>
    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <!-- Hidden field for ID -->
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Enter name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Enter password">
        </div>

        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" th:field="*{address}" placeholder="Enter address"></textarea>
        </div>

        <div class="form-group">
            <button type="submit">Update Student</button>
        </div>
    </form>
</div>
</body>
</html>
