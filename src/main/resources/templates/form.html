<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>

<div class="container">
    <h1>Add New Student</h1>

    <form th:action="@{/students}" th:object="${student}" method="post">

        <!-- Name -->
        <div class="form-group">
            <input type="text" th:field="*{name}" required>
            <label>Name</label>
            <p style="color:red" th:errors="*{name}"></p>
        </div>

        <!-- Email -->
        <div class="form-group">
            <input type="email" th:field="*{email}" required>
            <label>Email</label>
            <p style="color:red" th:errors="*{email}"></p>
        </div>

        <!-- Password -->
        <div class="form-group">
            <input type="password" th:field="*{password}" required>
            <label>Password</label>
            <p style="color:red" th:errors="*{password}"></p>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <input type="text" th:field="*{phone}" required>
            <label>Phone</label>
            <p style="color:red" th:errors="*{phone}"></p>
        </div>

        <!-- Address -->
        <div class="form-group">
            <textarea th:field="*{address}" required></textarea>
            <label>Address</label>
            <p style="color:red" th:errors="*{address}"></p>
        </div>

        <div class="form-group">
            <button type="submit">Save Student</button>
            <button type="reset">Clear</button>
        </div>

    </form>

    <div style="margin-top: 15px;">
        <a th:href="@{/students/list}">View All Students</a>
    </div>

</div>

</body>
</html>
