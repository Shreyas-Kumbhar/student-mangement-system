<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>

<div class="container">
    <h1>Add New Student</h1>

    <form th:action="@{/students}" th:object="${student}" method="post">

        <div class="form-group">
            <label>Name:</label>
            <input type="text" th:field="*{name}" placeholder="Enter name" required>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label>Phone:</label>
            <input type="text" th:field="*{phone}" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label>Address:</label>
            <textarea th:field="*{address}" placeholder="Enter address"></textarea>
        </div>

        <div class="form-group">
            <button type="submit">Save Student</button>
            <button type="reset">Clear</button>
        </div>

    </form>

    <!-- Navigation -->
    <div style="margin-top: 15px;">
        <a th:href="@{/students/list}">View All Students</a>
    </div>

</div>

</body>
</html>
