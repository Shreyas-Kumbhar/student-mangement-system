<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f3ff;
        }
        .btn-edit {
            background-color: #0d6efd;
            color: white;
        }
        .btn-edit:hover {
            background-color: #084298;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background-color: #a71d2a;
        }
        .add-button button {
            border-radius: 25px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Students Management</h1>

    <div class="mb-3 d-flex justify-content-end gap-2 add-button">

        <!-- Delete All Button -->
        <form th:action="@{/students/delete/all}" method="post">
            <button class="btn btn-danger"
                    onclick="return confirm('Are you sure you want to delete ALL students?');">
                <i class="fas fa-trash"></i> Delete All
            </button>
        </form>

        <!-- Add Button -->
        <a href="/students/add" class="btn btn-success">
            <i class="fas fa-plus"></i> Add New Student
        </a>

    </div>

    <!-- Students Table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s, iterStat : ${students}">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.phone}"></td>
                <td th:text="${s.address}"></td>
                <td>
                    <a th:href="@{'/students/update/' + ${s.id}}" class="btn btn-edit btn-sm me-1" data-bs-toggle="tooltip" title="Edit Student">
                        <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{'/students/delete/' + ${s.id}}" method="post" style="display:inline;">
                        <button class="btn btn-delete btn-sm" onclick="return confirm('Are you sure you want to delete this student?');" title="Delete Student">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    tooltipTriggerList.map(function (el) { return new bootstrap.Tooltip(el) })
</script>
</body>
</html>
