<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <link rel="stylesheet" th:href="@{/css/students.css}">
</head>
<body>
<div class="container">
    <h1>All Students</h1>

    <div class="add-button">
        <a href="/students/add">
            <button>Add New Student</button>
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s, iterStat : ${students}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.phone}"></td>
            <td th:text="${s.address}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
